name: Build and Test
on:
  push:
  pull_request:
jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - name: Run backend unit tests
        run: python backend/manage.py test tasks -v 2
        env:
          DJANGO_SECRET_KEY: ci-test-only-secret
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Run frontend unit tests
        run: npm test
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Django image
        run: docker build -t workflowhub-backend:ci ./backend
      - name: Build React image
        run: docker build -t workflowhub-frontend:ci ./frontend
