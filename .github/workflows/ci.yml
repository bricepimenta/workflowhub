name: Build and Test
on:
  push:
  pull_request:
jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python backend/manage.py test tasks
        env:
          DJANGO_SECRET_KEY: ci-test-only-secret
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Django image
        run: docker build -t workflowhub-backend:ci ./backend
      - name: Build React image
        run: docker build -t workflowhub-frontend:ci ./frontend
