services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-only-key}
      DJANGO_DEBUG: "false"
      DATABASE_PATH: /app/data/db.sqlite3
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:8080
    volumes: [db-data:/app/data]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  db-data:
